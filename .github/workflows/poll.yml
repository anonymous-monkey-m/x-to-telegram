name: x-to-telegram
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: x-to-telegram
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      rsshub:
        image: diygod/rsshub:latest
        ports: ["1200:1200"]
        env:
          CACHE_TYPE: memory
          NODE_ENV: production
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_COOKIE: ${{ secrets.TWITTER_COOKIE }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for RSSHub
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:1200/ >/dev/null && echo "RSSHub up" && break || sleep 5
          done
      - name: Poll once
        env:
          ONCE: "1"
          RSSHUB_BASE: http://127.0.0.1:1200
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          X_ACCOUNTS: ${{ secrets.X_ACCOUNTS }}
          STATE_FILE: ${{ github.workspace }}/state.json
        run: python3 poller/poller.py
      - name: Save state
        run: |
          git config user.name "x-feeds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git push)
